packages:
  - web
  - packages/*
  - scripts
# Native build scripts are optional accelerators; the pure-JS fallbacks are enough.
allowBuilds:
  sharp: false
  unrs-resolver: false
  bufferutil: false
  keccak: false
  utf-8-validate: false

overrides:
  # RainbowKit draws the WalletConnect QR with cuer 0.0.3, which asks qr for border: 0.
  # qr 0.6+ rejects that (RangeError "invalid border=0" breaks the page), so keep cuer on the last qr that accepts it.
  cuer>qr: 0.5.5
